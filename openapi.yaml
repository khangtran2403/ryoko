    put:
      tags: [Administration, Availability]
      operationId: setBlockedInventory
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BlockedInventoryRequest'}}}
      responses:
        '200':
          description: Updated inventory range
          content: {application/json: {schema: {$ref: '#/components/schemas/InventoryResult'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/room-types/{roomTypeID}/inventory:
    parameters:
      - {$ref: '#/components/parameters/RoomTypeID'}
    get:
      tags: [Administration, Availability]
      operationId: listRoomTypeInventory
      security: [{bearerAuth: []}]
      parameters:
        - {name: date_from, in: query, required: true, schema: {type: string, format: date}}
        - {name: date_to, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200':
          description: Inventory range
          content: {application/json: {schema: {$ref: '#/components/schemas/InventoryResult'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: ryoko_refresh_token

  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema: {type: string, format: uri}
    HotelID:
      name: hotelID
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    HotelPathID:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    RoomTypeID:
      name: roomTypeID
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    RoomTypePathID:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    AmenityID:
      name: amenityID
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    ImageID:
      name: imageID
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    BookingID:
      name: bookingID
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    ReviewID:
      name: reviewID
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    CheckIn:
      name: check_in
      in: query
      required: true
      schema: {type: string, format: date}
    CheckOut:
      name: check_out
      in: query
      required: true
      schema: {type: string, format: date}
    RoomsCount:
      name: rooms_count
      in: query
      required: true
      schema: {type: integer, format: int32, minimum: 1}
    GuestCount:
      name: guest_count
      in: query
      required: true
      schema: {type: integer, format: int32, minimum: 1}
    Page:
      name: page
      in: query
      schema: {type: integer, format: int32, minimum: 1, default: 1}
    PageSize:
      name: page_size
      in: query
      schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 20}

  responses:
    Alive:
      description: Process is alive
      headers: {Cache-Control: {schema: {type: string, const: no-store}}}
      content: {text/plain: {schema: {type: string, const: "alive\n"}}}
    Ready:
      description: API and PostgreSQL are ready
      headers: {Cache-Control: {schema: {type: string, const: no-store}}}
      content: {text/plain: {schema: {type: string, const: "ready\n"}}}
    NotReady:
      description: PostgreSQL is unavailable
      content: {text/plain: {schema: {type: string, const: "not ready\n"}}}
    Session:
      description: Session created; refresh token is set as an HttpOnly cookie
      headers:
        Set-Cookie: {schema: {type: string}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}
    NoContent: {description: Successful response with no body}
    BadRequest: {$ref: '#/components/responses/TextBadRequest'}
    TextBadRequest:
      description: Invalid request
      content:
        text/plain: {schema: {$ref: '#/components/schemas/ErrorText'}}
        application/json: {schema: {$ref: '#/components/schemas/ValidationErrors'}}
    Unauthorized:
      description: Authentication failed
      headers: {WWW-Authenticate: {schema: {type: string}}}
      content: {text/plain: {schema: {$ref: '#/components/schemas/ErrorText'}}}
    Forbidden:
      description: Authenticated caller is not allowed
      content: {text/plain: {schema: {$ref: '#/components/schemas/ErrorText'}}}
    NotFound:
      description: Resource not found
      content: {text/plain: {schema: {$ref: '#/components/schemas/ErrorText'}}}
    Conflict:
      description: Request conflicts with current resource state
      content: {text/plain: {schema: {$ref: '#/components/schemas/ErrorText'}}}
    BodyTooLarge:
      description: JSON body exceeds 64 KiB
      content: {text/plain: {schema: {type: string, const: "Request body too large\n"}}}
    UnsupportedMediaType:
      description: Content-Type is not application/json
      content: {text/plain: {schema: {type: string, const: "Content-Type must be application/json\n"}}}
    TooManyRequests:
      description: Rate limit exceeded
      headers: {Retry-After: {schema: {type: integer, minimum: 1}}}
      content: {text/plain: {schema: {$ref: '#/components/schemas/ErrorText'}}}
    InternalError:
      description: Internal server error
      content: {text/plain: {schema: {$ref: '#/components/schemas/ErrorText'}}}

  schemas:
    ErrorText: {type: string, description: Plain-text error ending with a newline}
    Message:
      type: object
      required: [message]
      properties: {message: {type: string}}
    ValidationErrors:
      type: object
      required: [errors]
      properties:
        errors: {type: array, items: {type: string}}
    DecimalMoney:
      type: string
      pattern: '^\d+(\.\d{1,2})?$'
      examples: ['1750000.00']
    NumericMoney:
      type: number
      minimum: 0
      examples: [1750000.00]
    BookingStatus: {type: string, enum: [confirmed, cancelled, completed]}
    Pagination:
      type: object
      required: [page, page_size, has_more]
      properties:
        page: {type: integer, format: int32, minimum: 1}
        page_size: {type: integer, format: int32, minimum: 1, maximum: 100}
        has_more: {type: boolean}
    RegisterRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 8}
        full_name: {type: string, minLength: 1}
        phone: {type: string}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
    Session:
      type: object
      required: [access_token, token_type, expires_in, refresh_expires_at]
      properties:
        access_token: {type: string}
        token_type: {type: string, const: Bearer}
        expires_in: {type: integer, format: int64, description: Seconds until access-token expiry}
        refresh_expires_at: {type: string, format: date-time}
    OAuthCodeRequest:
      type: object
      required: [code]
      properties: {code: {type: string, minLength: 1}}
    PasswordResetRequest:
      type: object
      required: [email]
      properties: {email: {type: string, format: email}}
    PasswordResetVerifyRequest:
      type: object
      required: [email, otp]
      properties:
        email: {type: string, format: email}
        otp: {type: string, pattern: '^\d{6}$'}
    PasswordResetVerifyResponse:
      type: object
      required: [reset_token, expires_at]
      properties:
        reset_token: {type: string}
        expires_at: {type: string, format: date-time}
    PasswordResetConfirmRequest:
      type: object
      required: [reset_token, new_password]
      properties:
        reset_token: {type: string, minLength: 1}
        new_password: {type: string, format: password, minLength: 8}
    UserProfileRequest:
      type: object
      required: [email, full_name]
      properties:
        email: {type: string, format: email}
        full_name: {type: string, minLength: 1}
        phone: {type: string}
    User:
      type: object
      required: [id, email, full_name, role, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        email: {type: string, format: email}
        full_name: {type: string}
        phone: {type: [string, 'null']}
        role: {type: string, enum: [user, admin]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    HotelRequest:
      type: object
      required: [name, address, city]
      properties:
        name: {type: string, minLength: 1}
        address: {type: string, minLength: 1}
        city: {type: string, minLength: 1}
        description: {type: string}
    Hotel:
      type: object
      required: [id, name, address, city, is_active, created_at]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        address: {type: string}
        city: {type: string}
        description: {type: [string, 'null']}
        is_active: {type: boolean}
        created_at: {type: string, format: date-time}
    HotelDetails:
      type: object
      required: [id, name, address, city, images, amenities, room_types, review_summary]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        address: {type: string}
        city: {type: string}
        description: {type: [string, 'null']}
        images: {type: array, items: {$ref: '#/components/schemas/HotelImage'}}
        amenities: {type: array, items: {$ref: '#/components/schemas/Amenity'}}
        room_types: {type: array, items: {$ref: '#/components/schemas/RoomType'}}
        review_summary: {$ref: '#/components/schemas/ReviewSummary'}
    ReviewSummary:
      type: object
      required: [average_rating, review_count]
      properties:
        average_rating:
          oneOf: [{$ref: '#/components/schemas/NumericMoney'}, {type: 'null'}]
        review_count: {type: integer, format: int32, minimum: 0}
    RoomTypeRequest:
      type: object
      required: [name, price_per_night, capacity, total_rooms]
      properties:
        name: {type: string, minLength: 1}
        description: {type: string}
        price_per_night: {$ref: '#/components/schemas/DecimalMoney'}
        capacity: {type: integer, format: int32, minimum: 1}
        total_rooms: {type: integer, format: int32, minimum: 1}
    RoomType:
      type: object
      required: [id, hotel_id, name, price_per_night, capacity, total_rooms, is_active, created_at]
      properties:
        id: {type: integer, format: int64}
        hotel_id: {type: integer, format: int64}
        name: {type: string}
        description: {type: [string, 'null']}
        price_per_night: {$ref: '#/components/schemas/NumericMoney'}
        capacity: {type: integer, format: int32}
        total_rooms: {type: integer, format: int32}
        is_active: {type: boolean}
        created_at: {type: string, format: date-time}
    AvailableRoomType:
      type: object
      required: [id, hotel_id, name, price_per_night, capacity, total_rooms, created_at, rooms_available]
      properties:
        id: {type: integer, format: int64}
        hotel_id: {type: integer, format: int64}
        name: {type: string}
        description: {type: [string, 'null']}
        price_per_night: {$ref: '#/components/schemas/NumericMoney'}
        capacity: {type: integer, format: int32}
        total_rooms: {type: integer, format: int32}
        created_at: {type: string, format: date-time}
        rooms_available: {type: integer, format: int32, minimum: 0}
    AmenityRequest:
      type: object
      required: [name]
      properties: {name: {type: string, minLength: 1}}
    AttachAmenityRequest:
      type: object
      required: [amenity_id]
      properties: {amenity_id: {type: integer, format: int64, minimum: 1}}
    Amenity:
      type: object
      required: [id, name, created_at]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        created_at: {type: string, format: date-time}
    HotelAmenity:
      type: object
      required: [hotel_id, amenity_id]
      properties:
        hotel_id: {type: integer, format: int64}
        amenity_id: {type: integer, format: int64}
    HotelImageRequest:
      type: object
      required: [image_url]
      properties: {image_url: {type: string, format: uri}}
    HotelImage:
      type: object
      required: [id, hotel_id, image_url, is_primary, created_at]
      properties:
        id: {type: integer, format: int64}
        hotel_id: {type: integer, format: int64}
        image_url: {type: string, format: uri}
        is_primary: {type: boolean}
        created_at: {type: string, format: date-time}
    HotelSearchItem:
      type: object
      required: [id, name, address, city, starting_price, available_room_type_count, created_at]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        address: {type: string}
        city: {type: string}
        description: {type: [string, 'null']}
        primary_image_url: {type: [string, 'null'], format: uri}
        starting_price: {$ref: '#/components/schemas/NumericMoney'}
        available_room_type_count: {type: integer, format: int32, minimum: 0}
        created_at: {type: string, format: date-time}
    HotelSearchResult:
      type: object
      required: [hotels, pagination]
      properties:
        hotels: {type: array, items: {$ref: '#/components/schemas/HotelSearchItem'}}
        pagination: {$ref: '#/components/schemas/Pagination'}
    CreateBookingRequest:
      type: object
      required: [check_in, check_out, rooms_count, guest_count]
      properties:
        check_in: {type: string, format: date}
        check_out: {type: string, format: date}
        rooms_count: {type: integer, format: int32, minimum: 1}
        guest_count: {type: integer, format: int32, minimum: 1}
    Booking:
      type: object
      required: [id, user_id, room_type_id, check_in, check_out, number_of_nights, rooms_count, guest_count, price_per_night, total_price, status, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        user_id: {type: integer, format: int64}
        room_type_id: {type: integer, format: int64}
        check_in: {type: string, format: date}
        check_out: {type: string, format: date}
        number_of_nights: {type: integer, minimum: 1}
        rooms_count: {type: integer, format: int32, minimum: 1}
        guest_count: {type: integer, format: int32, minimum: 1}
        price_per_night: {$ref: '#/components/schemas/DecimalMoney'}
        total_price: {$ref: '#/components/schemas/DecimalMoney'}
        status: {$ref: '#/components/schemas/BookingStatus'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    BookingList:
      type: object
      required: [bookings, pagination]
      properties:
        bookings: {type: array, items: {$ref: '#/components/schemas/Booking'}}
