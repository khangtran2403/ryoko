openapi: 3.1.0
info:
  title: Ryoko Hotel Booking API
  version: 1.0.0
  description: |
    HTTP API for hotel discovery, room-type availability, bookings, reviews,
    administration, password reset, and Google OAuth.

    JSON request bodies must use `Content-Type: application/json`, contain one
    JSON value, and be no larger than 64 KiB. Money inputs and formatted booking
    responses use decimal strings; generated SQL read models currently encode
    PostgreSQL numeric values as JSON numbers. Authenticated endpoints use a
    bearer access token. Refresh tokens are stored in an HttpOnly cookie.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
  - name: Authentication
  - name: Users
  - name: Hotels
  - name: Room types
  - name: Amenities
  - name: Images
  - name: Availability
  - name: Bookings
  - name: Reviews
  - name: Administration

paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check whether the API process is alive
      responses:
        '200': {$ref: '#/components/responses/Alive'}
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check whether the API can reach PostgreSQL
      responses:
        '200': {$ref: '#/components/responses/Ready'}
        '503': {$ref: '#/components/responses/NotReady'}

  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: Register a local account
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Create an access and refresh-token session
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new token pair
      description: Requires the configured frontend Origin and the refresh-token cookie.
      security: [{refreshCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the refresh token and clear its cookie
      description: Idempotent. Requires the configured frontend Origin.
      security: [{refreshCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/google:
    get:
      tags: [Authentication]
      operationId: startGoogleOAuth
      summary: Start a Google OAuth authorization-code flow
      responses:
        '302':
          description: Redirect to Google
          headers:
            Location: {schema: {type: string, format: uri}}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/google/callback:
    get:
      tags: [Authentication]
      operationId: finishGoogleOAuth
      summary: Process Google's callback and redirect with a short-lived Ryoko code
      parameters:
        - {name: state, in: query, schema: {type: string}}
        - {name: code, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        '302':
          description: Redirect to the frontend with a one-time `code` query parameter
          headers:
            Location: {schema: {type: string, format: uri}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/oauth/exchange:
    post:
      tags: [Authentication]
      operationId: exchangeOAuthCode
      summary: Exchange a one-time OAuth code for a Ryoko session
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OAuthCodeRequest'}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/password-reset/request:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: Request a password-reset verification code
      description: Always returns the same accepted response for a syntactically valid email.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetRequest'}
      responses:
        '202':
          description: Request accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/password-reset/verify:
    post:
      tags: [Authentication]
      operationId: verifyPasswordReset
      summary: Verify the emailed six-digit code
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetVerifyRequest'}
      responses:
        '200':
          description: Verification succeeded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PasswordResetVerifyResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/password-reset/confirm:
    post:
      tags: [Authentication]
      operationId: confirmPasswordReset
      summary: Set a new password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetConfirmRequest'}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}

  /me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Current user
          content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      tags: [Users]
      operationId: updateCurrentUser
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UserProfileRequest'}}}
      responses:
        '200':
          description: Updated user
          content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Users]
      operationId: deleteCurrentUser
      security: [{bearerAuth: []}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /hotels:
    get:
      tags: [Hotels]
      operationId: listHotelsByCity
      parameters:
        - {name: city, in: query, required: true, schema: {type: string, minLength: 1}}
      responses:
        '200':
          description: Hotels in the city
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Hotel'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Hotels, Administration]
      operationId: createHotel
      summary: Create a hotel (admin only)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/HotelRequest'}}}
      responses:
        '201':
          description: Hotel created
          content: {application/json: {schema: {$ref: '#/components/schemas/Hotel'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
  /hotels/search:
    get:
      tags: [Availability]
      operationId: searchAvailableHotels
      summary: Search hotels with available room types
      parameters:
        - {name: city, in: query, required: true, schema: {type: string, minLength: 1}}
        - {$ref: '#/components/parameters/CheckIn'}
        - {$ref: '#/components/parameters/CheckOut'}
        - {$ref: '#/components/parameters/RoomsCount'}
        - {$ref: '#/components/parameters/GuestCount'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - name: sort
          in: query
          schema: {type: string, enum: [price_asc, price_desc], default: price_asc}
      responses:
        '200':
          description: Available hotels
          content: {application/json: {schema: {$ref: '#/components/schemas/HotelSearchResult'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}
  /hotels/{id}:
    parameters:
      - {$ref: '#/components/parameters/HotelPathID'}
    get:
      tags: [Hotels]
      operationId: getHotel
      responses:
        '200':
          description: Hotel details
          content: {application/json: {schema: {$ref: '#/components/schemas/HotelDetails'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      tags: [Hotels, Administration]
      operationId: updateHotel
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/HotelRequest'}}}
      responses:
        '200':
          description: Updated hotel
          content: {application/json: {schema: {$ref: '#/components/schemas/Hotel'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Hotels, Administration]
      operationId: deleteHotel
      security: [{bearerAuth: []}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /hotels/{hotelID}/room-types:
    parameters:
      - {$ref: '#/components/parameters/HotelID'}
    get:
      tags: [Room types]
      operationId: listHotelRoomTypes
      responses:
        '200':
          description: Room types
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RoomType'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Room types, Administration]
      operationId: createRoomType
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RoomTypeRequest'}}}
      responses:
        '201':
          description: Room type created
          content: {application/json: {schema: {$ref: '#/components/schemas/RoomType'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
  /room-types/{id}:
    parameters:
      - {$ref: '#/components/parameters/RoomTypePathID'}
    get:
      tags: [Room types]
      operationId: getRoomType
      responses:
        '200':
          description: Room type
          content: {application/json: {schema: {$ref: '#/components/schemas/RoomType'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      tags: [Room types, Administration]
      operationId: updateRoomType
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RoomTypeRequest'}}}
      responses:
        '200':
          description: Updated room type
          content: {application/json: {schema: {$ref: '#/components/schemas/RoomType'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Room types, Administration]
      operationId: deleteRoomType
      security: [{bearerAuth: []}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /hotels/{hotelID}/available-room-types:
    parameters:
      - {$ref: '#/components/parameters/HotelID'}
      - {$ref: '#/components/parameters/CheckIn'}
      - {$ref: '#/components/parameters/CheckOut'}
      - {$ref: '#/components/parameters/RoomsCount'}
      - {$ref: '#/components/parameters/GuestCount'}
    get:
      tags: [Availability]
      operationId: listAvailableRoomTypes
      responses:
        '200':
          description: Available room types
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AvailableRoomType'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}

  /amenities:
    get:
      tags: [Amenities]
      operationId: listAmenities
      responses:
        '200':
          description: Amenities
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Amenity'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Amenities, Administration]
      operationId: createAmenity
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AmenityRequest'}}}
      responses:
        '201':
          description: Amenity created
          content: {application/json: {schema: {$ref: '#/components/schemas/Amenity'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
  /amenities/{amenityID}:
    parameters:
      - {$ref: '#/components/parameters/AmenityID'}
    put:
      tags: [Amenities, Administration]
      operationId: updateAmenity
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AmenityRequest'}}}
      responses:
        '200':
          description: Updated amenity
          content: {application/json: {schema: {$ref: '#/components/schemas/Amenity'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Amenities, Administration]
      operationId: deleteAmenity
      security: [{bearerAuth: []}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /hotels/{hotelID}/amenities:
    parameters:
      - {$ref: '#/components/parameters/HotelID'}
    get:
      tags: [Amenities]
      operationId: listHotelAmenities
      responses:
        '200':
          description: Hotel amenities
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Amenity'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Amenities, Administration]
      operationId: addHotelAmenity
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AttachAmenityRequest'}}}
      responses:
        '201':
          description: Amenity attached
          content: {application/json: {schema: {$ref: '#/components/schemas/HotelAmenity'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
  /hotels/{hotelID}/amenities/{amenityID}:
    parameters:
      - {$ref: '#/components/parameters/HotelID'}
      - {$ref: '#/components/parameters/AmenityID'}
    delete:
      tags: [Amenities, Administration]
      operationId: removeHotelAmenity
      security: [{bearerAuth: []}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /hotels/{hotelID}/images:
    parameters:
      - {$ref: '#/components/parameters/HotelID'}
    get:
      tags: [Images]
      operationId: listHotelImages
      responses:
        '200':
          description: Hotel images
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/HotelImage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Images, Administration]
      operationId: createHotelImage
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/HotelImageRequest'}}}
      responses:
        '201':
          description: Image created
          content: {application/json: {schema: {$ref: '#/components/schemas/HotelImage'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
  /hotels/{hotelID}/images/{imageID}/primary:
    parameters:
      - {$ref: '#/components/parameters/HotelID'}
      - {$ref: '#/components/parameters/ImageID'}
    put:
      tags: [Images, Administration]
      operationId: setPrimaryHotelImage
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Primary image updated
          content: {application/json: {schema: {$ref: '#/components/schemas/HotelImage'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /hotels/{hotelID}/images/{imageID}:
    parameters:
      - {$ref: '#/components/parameters/HotelID'}
      - {$ref: '#/components/parameters/ImageID'}
    delete:
      tags: [Images, Administration]
      operationId: deleteHotelImage
      security: [{bearerAuth: []}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /room-types/{roomTypeID}/bookings:
    parameters:
      - {$ref: '#/components/parameters/RoomTypeID'}
    post:
      tags: [Bookings]
      operationId: createBooking
      security: [{bearerAuth: []}]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 255}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateBookingRequest'}}}
      responses:
        '201':
          description: Booking confirmed
          content: {application/json: {schema: {$ref: '#/components/schemas/Booking'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
