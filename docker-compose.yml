name: ryoko

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ryoko
      POSTGRES_PASSWORD: ryoko
      POSTGRES_DB: ryoko
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryoko -d ryoko"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    command:
      - -path
      - /migrations
      - -database
      - postgres://ryoko:ryoko@postgres:5432/ryoko?sslmode=disable
      - up
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  api:
    image: ryoko:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENV: development
      API_PORT: 8080
      DATABASE_URL: postgres://ryoko:ryoko@postgres:5432/ryoko?sslmode=disable
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      JWT_SECRET: local-development-jwt-secret-at-least-32-bytes
      PASSWORD_RESET_PEPPER: local-development-password-reset-pepper-32-bytes
      OAUTH_COOKIE_SECRET: local-development-oauth-cookie-secret-32-bytes
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: no-reply@ryoko.local
      SMTP_REQUIRE_TLS: "false"
      REFRESH_COOKIE_SECURE: "false"
      OAUTH_COOKIE_SECURE: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-local-google-client-secret}
      GOOGLE_OAUTH_REDIRECT_URL: http://localhost:8080/auth/google/callback
      OAUTH_SUCCESS_REDIRECT_URL: ${OAUTH_SUCCESS_REDIRECT_URL:-http://localhost:3000/auth/callback}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
